<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exchange Board (dev)</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 16px;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
    }
    pre {
      background: var(--tg-theme-secondary-bg-color, #f2f2f2);
      padding: 12px;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h1>Exchange Board</h1>
  <p id="status">Checking your Telegram login…</p>
  <pre id="out" hidden></pre>
  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    const statusEl = document.getElementById("status");
    const outEl = document.getElementById("out");

    if (!tg.initData) {
      statusEl.textContent = "Open this page from the bot inside Telegram.";
    } else {
      fetch("/api/me", { headers: { Authorization: "tma " + tg.initData } })
        .then(async (response) => {
          const body = await response.json();
          statusEl.textContent = response.ok
            ? `Hello, ${body.first_name}! Auth works.`
            : `Error ${response.status}: ${body.detail}`;
          outEl.textContent = JSON.stringify(body, null, 2);
          outEl.hidden = false;
        })
        .catch((error) => {
          statusEl.textContent = "Request failed: " + error;
        });
    }
  </script>
</body>
</html>
